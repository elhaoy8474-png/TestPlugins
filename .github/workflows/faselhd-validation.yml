name: Validate FaselHD

on:
  push:
    branches:
      - feature/faselhd-provider
      - master
    paths:
      - 'FaselHD/**'
      - '.github/workflows/faselhd-validation.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches:
      - master
    paths:
      - 'FaselHD/**'
      - '.github/workflows/faselhd-validation.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run parser tests and build FaselHD
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :FaselHD:testDebugUnitTest :FaselHD:make
