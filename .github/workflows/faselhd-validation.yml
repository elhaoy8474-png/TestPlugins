name: Validate Provider Parsers

concurrency:
  group: faselhd-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/faselhd-provider
      - master
    paths:
      - 'FaselHD/**'
      - 'QFilm/**'
      - '.github/workflows/faselhd-validation.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches:
      - master
    paths:
      - 'FaselHD/**'
      - '.github/workflows/faselhd-validation.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run parser tests and build QFilm and FaselHD
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :FaselHD:testDebugUnitTest :FaselHD:make :QFilm:testDebugUnitTest :QFilm:make

      - name: Publish verified FaselHD build and v4 index
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch builds "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          cp FaselHD/build/FaselHD.cs3 publish/FaselHD.cs3
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          artifact = Path("publish/FaselHD.cs3")
          raw = artifact.read_bytes()
          manifest_path = Path("publish/plugins-v4.json")
          plugins = json.loads(manifest_path.read_text(encoding="utf-8"))
          plugins = [p for p in plugins if p.get("internalName") != "FaselHD"]
          plugins.append({
              "iconUrl": "https://static.faselhdcdn.com/wp-content/uploads/2022/06/logo-1.png",
              "fileHash": "sha256-" + hashlib.sha256(raw).hexdigest(),
              "apiVersion": 1,
              "repositoryUrl": "https://github.com/elhaoy8474-png/TestPlugins",
              "fileSize": len(raw),
              "status": 3,
              "language": "ar",
              "authors": ["elhaoy8474-png"],
              "tvTypes": ["Movie", "TvSeries", "Anime"],
              "version": 8,
              "internalName": "FaselHD",
              "description": "FaselHD v8 - live block cards and user-operated Cloudflare verification",
              "url": "https://raw.githubusercontent.com/elhaoy8474-png/TestPlugins/builds/FaselHD.cs3",
              "name": "FaselHD"
          })
          manifest_path.write_text(json.dumps(plugins, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")
          PY
          cd publish
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add FaselHD.cs3 plugins-v4.json
          git commit -m "Publish verified FaselHD CloudStream build"
          git push origin builds

          # Pin repo.json to the exact commit containing the freshly computed
          # plugin index. A second commit avoids a self-referential commit hash.
          INDEX_SHA="$(git rev-parse HEAD)"
          cat > repo.json <<EOF
          {
            "name": "TestPlugins Repository",
            "description": "مستودع إضافات CloudStream: QFilm وFaselHD وCimaClub وViu وWeTV وAhwakTV وAlooyTV وغيرها",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$INDEX_SHA/plugins-v4.json"
            ]
          }
          EOF
          git add repo.json
          git commit -m "Pin repository index to verified FaselHD manifest"
          git push origin builds
