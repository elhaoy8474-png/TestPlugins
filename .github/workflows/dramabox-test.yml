name: DramaBox Test Build

on:
  push:
    branches:
      - dramabox-test-v5
    paths:
      - 'DramaBox/**'
      - '.github/workflows/dramabox-test.yml'

permissions:
  contents: read

jobs:
  build-dramabox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make
          mkdir -p artifacts
          find . -type f -name '*.cs3' -print
          find DramaBox -type f -name '*.cs3' -exec cp {} artifacts/DramaBox.cs3 \;
          test -s artifacts/DramaBox.cs3

      - name: Upload private-test package (no public repository publish)
        uses: actions/upload-artifact@v4
        with:
          name: DramaBox-v5-test-${{ github.run_number }}
          path: artifacts/DramaBox.cs3
          if-no-files-found: error
          retention-days: 14
