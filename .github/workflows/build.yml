name: Build

concurrency:
  group: build-v2
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - dramabox-diagnostic-v4
      - feature/faselhd-provider
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson
          find . -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"


      - name: Package AhwakTV source
        run: |
          PACKAGE="$GITHUB_WORKSPACE/artifacts/AhwakTV-Source"
          mkdir -p "$PACKAGE"
          cp -R "$GITHUB_WORKSPACE/src/AhwakTV" "$PACKAGE/"
          rm -rf "$PACKAGE/AhwakTV/build"
          cp "$GITHUB_WORKSPACE/src/build.gradle.kts" "$PACKAGE/"
          cp "$GITHUB_WORKSPACE/src/settings.gradle.kts" "$PACKAGE/"
          cp "$GITHUB_WORKSPACE/src/gradle.properties" "$PACKAGE/"
          cp "$GITHUB_WORKSPACE/src/gradlew" "$PACKAGE/"
          cp "$GITHUB_WORKSPACE/src/gradlew.bat" "$PACKAGE/"
          cp -R "$GITHUB_WORKSPACE/src/gradle" "$PACKAGE/"
          cat > "$PACKAGE/README-AR.md" <<'EOF'
          # إضافة AhwakTV

          مشروع مصدر مستقل لإضافة أهواك تي في المتوافقة مع واجهة CloudStream التي يستخدمها KodaStream.

          ## البناء
          - JDK 17
          - Gradle Wrapper 8.12 المرفق
          - Android SDK Platform 35 وBuild Tools 35
          - Android Gradle Plugin 8.7.3 وKotlin Gradle Plugin 2.4.0 كما في ملف البناء المرجعي

          من جذر المشروع نفّذ:
          ```bash
          ./gradlew --no-daemon :AhwakTV:make
          ```

          لإعادة بناء كل الإضافات وإنشاء قائمة المستودع:
          ```bash
          ./gradlew --no-daemon make makePluginsJson
          ```

          ينتج ملف `.cs3` داخل مجلد بناء وحدة AhwakTV. يتم توليد `manifest.json` داخل الحزمة بواسطة إضافة Gradle من التعليمة `@CloudstreamPlugin` على الصنف `com.ahwaktv.AhwakTVPlugin`.

          ## إضافة المستودع إلى KodaStream
          استخدم رابط المستودع:
          `https://raw.githubusercontent.com/elhaoy8474-png/TestPlugins/builds/repo.json`

          ## النطاق
          - الصفحة الرئيسية، قائمة المسلسلات، الجديد، والأكثر مشاهدة.
          - فهرس التصنيفات وصفحات التصنيف.
          - البحث عبر نموذج البحث الذي يقدمه الموقع إذا كان موجوداً في الصفحة.
          - تفاصيل المسلسل والحلقات والمواسم، مع تجميع الحلقات بحسب اسم المسلسل وترتيبها رقمياً.
          - استخراج روابط الفيديو العامة الظاهرة في عناصر iframe/video/source، وتمرير مشغلات التضمين إلى ExtractorApi المسجل في التطبيق.
          - لا تتجاوز الإضافة تسجيل الدخول أو CAPTCHA أو أي قيود وصول، ولا تنشئ روابط تشغيل غير موجودة في الصفحة.

          ## حالة الاختبار
          نجاح بناء Gradle والتحقق من إنشاء ملف `.cs3` وقائمة `plugins.json` لا يثبت وحده أن كل خادم فيديو يعمل داخل التطبيق. يلزم اختبار تشغيل فعلي على KodaStream مع صفحة/حلقة متاحة.
          EOF
          cat > "$PACKAGE/COMPATIBILITY-AR.md" <<'EOF'
          # مراجعة توافق KodaStream

          تمت مراجعة أرشيف cloudSTREAM3-main.zip مباشرةً. القيم الموجودة في مشروع المضيف:
          - Gradle Wrapper: 9.4.1
          - Android Gradle Plugin: 9.1.1
          - Kotlin Gradle Plugin: 2.4.0
          - هدف JVM في مكتبة المضيف: 11

          واجهات المصدر التي تمت مراجعتها:
          - MainAPI: getMainPage(page, request), search(query, page), quickSearch(query), load(url)، وloadLinks(data, isCasting, subtitleCallback, callback).
          - BasePlugin: registerMainAPI(MainAPI) وregisterExtractorAPI(ExtractorApi).
          - ExtractorApi: getUrl(url, referer, subtitleCallback, callback)، كما يوفر المضيف loadExtractor(url, referer, subtitleCallback, callback).
          - PluginManager: يتوقع ملف .cs3 يحتوي classes.dex وmanifest.json، ثم يقرأ pluginClassName وrequiresResources ويحمل الصنف عبر PathClassLoader.

          نقطة مهمة عن الاختبار: بناء هذه الإضافة تم عبر قالب CloudStream للإضافات (Gradle 8.12 وAGP 8.7.3 وKotlin 2.4.0، مع اعتماد cloudstream3 pre-release). تمت مطابقة توقيعات API مع مصدر KodaStream المرفق، لكن البناء لم يكن مشروع Gradle فرعياً داخل نسخة KodaStream نفسها؛ لذلك يلزم تثبيت .cs3 واختباره على التطبيق الفعلي لإثبات التوافق وقت التشغيل.
          EOF
          cat > "$PACKAGE/manifest-reference.json" <<'EOF'
          {
            "name": "AhwakTV",
            "pluginClassName": "com.ahwaktv.AhwakTVPlugin",
            "requiresResources": false,
            "version": 7
          }
          EOF
          cat > "$PACKAGE/BUILD-REPORT.md" <<EOF
          # تقرير بناء AhwakTV
          - Commit: $GITHUB_SHA
          - Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Build: Gradle tasks make and makePluginsJson
          - Runtime playback: not verified by CI; test on KodaStream is still required.
          EOF
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -qr AhwakTV-Source.zip AhwakTV-Source
          cp "$GITHUB_WORKSPACE/artifacts/AhwakTV-Source.zip" "$GITHUB_WORKSPACE/builds/AhwakTV-Source.zip"

      - name: Upload AhwakTV source and plugin
        uses: actions/upload-artifact@v4
        with:
          name: AhwakTV-Package-${{ github.run_number }}
          path: |
            artifacts/AhwakTV-Source.zip
            builds/AhwakTV.cs3
          if-no-files-found: error
          retention-days: 30

      - name: Publish builds
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build $GITHUB_SHA"
            git push origin builds
          fi
